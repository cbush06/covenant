######################## Success story #############################
success_story:
  enable: true
  bg_image: "images/backgrounds/success-story.jpg"
  title: "About CCA's Curriculum"
  content: |
    CCA uses the A.C.E. curriculum. Accelerated Christian Education (A.C.E.) School of Tomorrow 
    offers the key to academic excellence in a strong Bible-based, character-building program. 
    This life-changing learning system has proven effective in the lives of students for over 50 
    years. Join the thousands of schools and homeschools using the A.C.E. program worldwide!
  # video link
  video_link: https://www.youtube.com/embed/7haJwOoOa2g?si=VUuBIWuvNKTlrhil
