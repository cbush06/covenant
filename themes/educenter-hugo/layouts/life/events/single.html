{{ define "main" }}

<section class="section">
    <article class="container">
        <div class="row">
            <div class="col-12">
                <h1>{{ .Title }}</h1>
            </div>
        </div>
        <div class="row">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 d-flex flex-row" style="gap: 0.5rem;">
                        {{ .Params.Author | title }}
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 d-flex flex-row text-muted" style="gap: 0.5rem;">
                        <time datetime=".PublishDate">{{ .PublishDate.Format "January 02, 2006" }}</time>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <img
                    src="{{ (resources.Get .Params.image).Permalink }}"
                    class="d-block mx-auto my-2 img-fluid img-thumbnail"
                    style="max-width: clamp(1vw, 100%, 600px);"
                />
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="content">
                    {{ .Content }}
                </div>
            </div>
        </div>
    </article>
</section>

{{ end }}
