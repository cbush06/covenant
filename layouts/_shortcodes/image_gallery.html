{{ $dir := .Get "dir" }}
{{ $images := readDir $dir }}
{{ $id := math.Rand | math.Mul 10000 | math.Ceil }}

<div class="card-columns">
{{ range $images }}
    {{ if not .IsDir }}
    {{ $imagePath := (printf "%s/%s" ($dir | replaceRE `^/?static/?` ``) .Name) | absURL }}
    <div class="card p-0">
        <a class="venobox" href="{{ $imagePath }}" data-gall="imggal-{{ $id }}" data-fitview="true">
            <img src="{{ $imagePath }}" class="card-img mb-0" />
        </a>
    </div>
    {{ end }}
{{ end }}
</div>
