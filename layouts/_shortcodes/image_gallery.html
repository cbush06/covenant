{{ $gallery := .Get "gallery" }}
{{ $images := resources.Match (printf "images/galleries/%s/*" $gallery) }}
{{ $id := math.Rand | math.Mul 10000 | math.Ceil }}

<div class="card-columns">
{{ range $images }}
    <div class="card p-0">
        <a class="venobox" href="{{ .RelPermalink }}" data-gall="imggal-{{ $id }}" data-fitview="true">
            <img src="{{ (.Fit "500x800 Center").RelPermalink }}" class="card-img mb-0" />
        </a>
    </div>
{{ end }}
</div>
